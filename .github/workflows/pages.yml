name: Deploy GraphLive to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: npx playwright test --config playwright.pages.config.ts
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pages-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: pages-dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then exit 1; fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          flags=(--latest)
          if [[ "$version" == *-* ]]; then flags=(--prerelease); fi
          gh release create "$tag" --target "$GITHUB_SHA" "${flags[@]}" --title "GraphLive $tag" --notes-file "releases/$version.txt"
