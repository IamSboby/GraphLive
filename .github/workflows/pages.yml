name: Deploy GraphLive to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: npx playwright test --config playwright.pages.config.ts
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  release:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then exit 1; fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          flags=(--latest)
          if [[ "$version" == *-* ]]; then flags=(--prerelease); fi
          gh release create "$tag" --target "$GITHUB_SHA" "${flags[@]}" --title "GraphLive $tag" --notes-file "releases/$version.txt"
